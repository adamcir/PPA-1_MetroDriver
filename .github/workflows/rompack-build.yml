name: Build PPA-1 MetroDriver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ASM game and C ROM packer
        run: make
      - name: Verify intermediate program and final ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          program=Path("out/main.prg").read_bytes()
          rom=Path("out/main.bin").read_bytes()
          assert len(program)==65536
          assert len(rom)==2*1024*1024
          assert rom[:65536]==program
          assert rom[65536:65540]==b"PIMG"
          print("ASM -> program.prg -> ROMPACK -> ROM with uploaded Ezh3 BMP: OK")
          PY
      - name: Test BMP and raw-ROM packing
        run: make test-rompack
      - name: Build without optional BMP
        run: |
          mv assets/cab_ezh3.bmp /tmp/ci-cab-ezh3.bmp
          make
          python3 - <<'PY'
          from pathlib import Path
          program=Path("out/main.prg").read_bytes()
          rom=Path("out/main.bin").read_bytes()
          assert len(rom)==2*1024*1024
          assert rom[:65536]==program
          assert set(rom[65536:])=={255}
          print("No assets: ROMPACK generated a clean final ROM")
          PY
      - name: Build with test BMP
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          w,h=320,200
          stride=((w*3+3)//4)*4
          rows=bytearray()
          for y in range(h):
              row=bytearray()
              for x in range(w):
                  row.extend(((x+y)%256, y%256, x%256))
              row.extend(bytes(stride-w*3))
              rows.extend(row)
          header=struct.pack("<2sIHHIIiiHHIIiiII", b"BM",54+len(rows),0,0,54,40,w,h,1,24,0,len(rows),2835,2835,0,0)
          Path("assets/cab_ecs.bmp").write_bytes(header+rows)
          PY
          make
          python3 - <<'PY'
          from pathlib import Path
          d=Path("out/main.bin").read_bytes()
          assert len(d)==2*1024*1024
          assert d[:65536]==Path("out/main.prg").read_bytes()
          assert d[65536:65540]==b"PIMG"
          print("Bitmap resource was packed into bank 0001")
          PY
