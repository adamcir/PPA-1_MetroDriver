name: Build PPA-1 MetroDriver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ASM, restore uploaded Ezh3 assets and pack ROM
        run: make

      - name: Verify layered ROM layout, program and color keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          program=Path("out/main.prg").read_bytes()
          rom=Path("out/main.bin").read_bytes()
          assert len(program)==65536
          assert len(rom)==2*1024*1024
          assert rom[:65536]==program
          for bank in (1,2):
              img=rom[bank*65536:(bank+1)*65536]
              assert img[:4]==b"PIMG"
              assert struct.unpack_from("<HH",img,6)==(320,200)
              assert struct.unpack_from("<H",img,12)[0]==0x400
          cab=rom[65536+0x400:65536+0x400+64000]
          pult=rom[131072+0x400:131072+0x400+64000]
          assert cab.count(254)>1000 and cab.count(255)>1000
          assert pult.count(255)>1000
          print("PPA-1 ROM: code bank 0000, masked cab bank 0001, panel bank 0002: OK")
          PY

      - name: Test stand-alone ROM packer
        run: make test-rompack

      - name: Verify build without optional art
        run: |
          mv assets/cab_ezh3.bmp /tmp/ci-legacy-cab.bmp
          mv assets/cab_ezh3_layer.bmp.xz.b64 /tmp/ci-cab-mask.b64
          mv assets/pult_ezh3.bmp.gz.b64 /tmp/ci-pult.b64
          make
          python3 - <<'PY'
          from pathlib import Path
          program=Path("out/main.prg").read_bytes()
          rom=Path("out/main.bin").read_bytes()
          assert len(rom)==2*1024*1024
          assert rom[:65536]==program
          assert set(rom[65536:])=={255}
          print("Empty asset fallback: OK")
          PY

      - name: Verify new GIMP BMPs override bundled assets and preserve masks
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          def bmp(path, pixels):
              w,h=320,200
              stride=w*3
              rows=bytearray()
              for y in reversed(range(h)):
                  for x in range(w):
                      r,g,b=pixels(x,y)
                      rows.extend((b,g,r))
              head=struct.pack("<2sIHHIIiiHHIIiiII",
                  b"BM",54+len(rows),0,0,54,40,w,h,1,24,0,len(rows),2835,2835,0,0)
              Path(path).write_bytes(head+rows)

          bmp("assets/cab_ezh3_layer.bmp", lambda x,y:
              (0,255,0) if x<160 else ((0,0,255) if y>=100 else (166,164,157)))
          bmp("assets/pult_ezh3.bmp", lambda x,y:
              (0,255,0) if y<100 else (166,164,157))
          PY
          make
          python3 - <<'PY'
          from pathlib import Path
          rom=Path("out/main.bin").read_bytes()
          cab=rom[65536+0x400:65536+0x400+64000]
          panel=rom[131072+0x400:131072+0x400+64000]
          assert cab[0]==255 and cab[100*320+200]==254
          assert cab[50*320+200] not in (254,255)
          assert panel[0]==255 and panel[199*320+160] not in (254,255)
          print("Direct GIMP BMP overrides and both color keys: OK")
          PY
